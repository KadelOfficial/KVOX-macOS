name: Build KVOX macOS Universal

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recover KVOX source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          cat payload2/source.part.*.b64 > /tmp/kvox-source.b64
          python3 - <<'PY'
          import base64, pathlib
          encoded = ''.join(pathlib.Path('/tmp/kvox-source.b64').read_text().split())
          raw = base64.b64decode(encoded, validate=True)
          pathlib.Path('/tmp/kvox-source.tar.gz').write_bytes(raw)
          print(f'Decoded {len(raw)} bytes')
          PY
          tar -tzf /tmp/kvox-source.tar.gz
          tar -xzf /tmp/kvox-source.tar.gz -C recovered
          echo 'Recovered project files:'
          find recovered -maxdepth 4 -type f | sort

      - name: Locate project and install JUCE 9.0.2
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_CMAKE="$(grep -rl --include=CMakeLists.txt 'project(KVOX' recovered | head -1 || true)"
          if [[ -z "$PROJECT_CMAKE" ]]; then
            echo 'ERROR: Could not find the KVOX CMake project in the recovered source bundle.' >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_CMAKE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "KVOX project: $PROJECT_DIR"
          rm -rf "$PROJECT_DIR/dependencies/JUCE"
          mkdir -p "$PROJECT_DIR/dependencies"
          git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$PROJECT_DIR/dependencies/JUCE"

      - name: Show macOS toolchain
        run: |
          xcodebuild -version
          cmake --version
          uname -m

      - name: Configure Universal binary
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_DIR" -B build-macos -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET='11.0'

      - name: Build VST3 and Audio Unit
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-macos --config Release --target KVOX_VST3 KVOX_AU --parallel 4

      - name: Verify and package plugins
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.4.0'
          DIST="$PWD/dist"
          STAGE="$PWD/stage"
          INSTALLER_ROOT="$PWD/installer-root"
          rm -rf "$DIST" "$STAGE" "$INSTALLER_ROOT"
          mkdir -p "$DIST" "$STAGE/Library/Audio/Plug-Ins/VST3" "$STAGE/Library/Audio/Plug-Ins/Components" "$INSTALLER_ROOT"

          VST3="$(find build-macos -type d -name 'KVOX.vst3' -path '*Release*' -print -quit)"
          AU="$(find build-macos -type d -name 'KVOX.component' -path '*Release*' -print -quit)"
          [[ -n "$VST3" && -d "$VST3" ]] || { echo 'ERROR: KVOX.vst3 not found'; exit 1; }
          [[ -n "$AU" && -d "$AU" ]] || { echo 'ERROR: KVOX.component not found'; exit 1; }

          echo "VST3: $VST3"
          echo "AU:   $AU"

          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --verify --deep --strict --verbose=2 "$VST3"
          codesign --verify --deep --strict --verbose=2 "$AU"

          VST3_BIN="$VST3/Contents/MacOS/KVOX"
          AU_BIN="$AU/Contents/MacOS/KVOX"
          lipo -verify_arch arm64 x86_64 "$VST3_BIN"
          lipo -verify_arch arm64 x86_64 "$AU_BIN"
          lipo -info "$VST3_BIN"
          lipo -info "$AU_BIN"

          ditto "$VST3" "$STAGE/Library/Audio/Plug-Ins/VST3/KVOX.vst3"
          ditto "$AU" "$STAGE/Library/Audio/Plug-Ins/Components/KVOX.component"

          PKG="$DIST/KVOX-${VERSION}-macOS-Universal.pkg"
          pkgbuild \
            --root "$STAGE" \
            --identifier 'com.kadel.kvox' \
            --version "$VERSION" \
            --install-location / \
            "$PKG"

          cat > "$INSTALLER_ROOT/READ ME.txt" <<'TXT'
          KVOX 0.4.0 — macOS Universal

          INSTALL
          1. Open KVOX-0.4.0-macOS-Universal.pkg
          2. Click Continue > Install
          3. Restart your DAW and rescan plug-ins if needed.

          INSTALLED FORMATS
          VST3: /Library/Audio/Plug-Ins/VST3/KVOX.vst3
          AU:   /Library/Audio/Plug-Ins/Components/KVOX.component

          COMPATIBILITY
          Apple Silicon (arm64) + Intel (x86_64), macOS 11 or newer.

          SIGNING
          This free build is ad-hoc signed, not Apple-notarized. If Gatekeeper blocks the installer,
          Control-click the PKG > Open, or allow it in System Settings > Privacy & Security.
          TXT

          cp "$PKG" "$INSTALLER_ROOT/"
          cat > "$INSTALLER_ROOT/Uninstall KVOX.command" <<'SH'
          #!/bin/bash
          set -e
          sudo rm -rf '/Library/Audio/Plug-Ins/VST3/KVOX.vst3'
          sudo rm -rf '/Library/Audio/Plug-Ins/Components/KVOX.component'
          echo 'KVOX has been removed. Restart your DAW.'
          read -r -p 'Press Return to close...'
          SH
          chmod +x "$INSTALLER_ROOT/Uninstall KVOX.command"

          ditto -c -k --sequesterRsrc --keepParent "$INSTALLER_ROOT" "$DIST/KVOX-${VERSION}-macOS-Universal-Installer.zip"
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "$DIST/KVOX-${VERSION}-VST3-macOS-Universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$AU" "$DIST/KVOX-${VERSION}-AU-macOS-Universal.zip"

          if hdiutil create -volname "KVOX ${VERSION}" -srcfolder "$INSTALLER_ROOT" -ov -format UDZO "$DIST/KVOX-${VERSION}-macOS-Universal.dmg"; then
            echo 'DMG created successfully.'
          else
            echo 'DMG creation is not permitted on this GitHub runner; PKG and Installer ZIP are complete and will still be uploaded.'
            rm -f "$DIST/KVOX-${VERSION}-macOS-Universal.dmg"
          fi

          (cd "$DIST" && shasum -a 256 * > SHA256SUMS.txt)
          echo 'Distribution files:'
          ls -lh "$DIST"

      - name: Upload ready-to-install macOS files
        uses: actions/upload-artifact@v4
        with:
          name: KVOX-0.4.0-macOS-Universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30